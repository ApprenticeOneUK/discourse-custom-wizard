name: Upstream compatibility sweep

on:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stable:
    uses: discourse/.github/.github/workflows/discourse-plugin.yml@v1
    with:
      core_ref: stable

  main:
    uses: discourse/.github/.github/workflows/discourse-plugin.yml@v1
    with:
      core_ref: main

